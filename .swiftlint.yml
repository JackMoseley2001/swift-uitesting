# SwiftLint configuration. The Lint workflow runs `swiftlint lint --strict`, so a warning
# fails a pull request. The version it runs is the tag of the image in `lint.yml`.

included:
  - Sources
  - Tests
  - Examples
  - Package.swift
  - Package@swift-6.3.swift

excluded:
  - .build
  - Examples/Demo/DerivedData

# The size of a function, type or file is left to review. The actions of the library
# take `filePath` and `line` on top of their own parameters, and a test suite is as
# long as what it tests.
disabled_rules:
  - cyclomatic_complexity
  - file_length
  - function_body_length
  - function_parameter_count
  - type_body_length

opt_in_rules:
  # Style
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - convenience_type
  - explicit_init
  - implicit_return
  - joined_default_parameter
  - literal_expression_end_indentation
  - modifier_order
  - multiline_parameters
  - operator_usage_whitespace
  - optional_enum_case_matching
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - shorthand_optional_binding
  - sorted_imports
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_between_cases
  - yoda_condition
  # Idiom and performance
  - array_init
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - empty_string
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - last_where
  - prefer_zero_over_explicit_init
  - reduce_into
  - return_value_from_void_function
  - sorted_first_last
  # Every public declaration has a documentation comment.
  - missing_docs
  # Not in tests or the demo: see the configuration files in those folders.
  - force_unwrapping

# A multi-line string holds what a macro expands to, which cannot be wrapped.
line_length:
  warning: 120
  error: 200
  ignores_multiline_strings: true

# Short names are what reads best for a coordinate or a direction (`x`, `to`, `up`),
# and the functions that the macros expand to start with two underscores.
identifier_name:
  min_length: 1
  allowed_symbols: ["_"]

type_name:
  min_length: 2

large_tuple:
  warning: 3
  error: 4
