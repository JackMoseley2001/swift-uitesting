name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The first and last Xcode of each major version that the package supports. Each
        # runner image has every minor version of the major versions it carries.
        include:
          - xcode: "16.0"
            runner: macos-15
          - xcode: "16.4"
            runner: macos-15
          - xcode: "26.0"
            runner: macos-15
          - xcode: "26.6"
            runner: macos-26
          - xcode: "27.1"
            runner: xcode-27
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select --switch "/Applications/Xcode_${{ matrix.xcode }}.app"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: |
          # With the prebuilt swift-syntax that SwiftPM downloads for macros, the macro
          # test bundle fails to link. SwiftPM has had prebuilts, and the option that
          # turns them off, since Swift 6.1.
          options=()
          if swift test --help | grep -q -- "--disable-experimental-prebuilts"; then
            options+=(--disable-experimental-prebuilts)
          fi
          swift test ${options[@]+"${options[@]}"}
