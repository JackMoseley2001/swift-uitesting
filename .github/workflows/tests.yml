name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Xcode 27)
    runs-on: xcode-27
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: swift test
