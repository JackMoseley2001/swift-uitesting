name: Tests

on:
  # Not for a change to documentation or the licence alone, which no test reads.
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**/*.md"
      - LICENSE
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - LICENSE
  # By hand, from the Actions tab or with `gh workflow run`, on any branch.
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The latest Xcode of each major version that the package supports.
        include:
          - xcode: "16.4"
            runner: macos-15
          - xcode: "26.6"
            runner: macos-26
          - xcode: "27.2"
            runner: xcode-27
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Select Xcode
        run: xcodes select "${{ matrix.xcode }}"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: |
          # With the prebuilt swift-syntax that SwiftPM downloads for macros, the macro
          # test bundle fails to link. SwiftPM has had prebuilts, and the option that
          # turns them off, since Swift 6.1.
          options=()
          if swift test --help | grep -q -- "--disable-experimental-prebuilts"; then
            options+=(--disable-experimental-prebuilts)
          fi
          swift test ${options[@]+"${options[@]}"}

  build:
    name: Build (${{ matrix.platform }})
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every platform in the package's manifest. The build is for no device in
        # particular, so it needs the platform's SDK, which Xcode has, and no simulator.
        platform:
          - iOS
          - macOS
          - tvOS
          - watchOS
          - visionOS
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Select Xcode
        run: xcodes select "27.2"

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          # UITesting depends on the package's other two libraries, so this builds all three.
          xcodebuild build \
            -scheme UITesting \
            -destination "generic/platform=${{ matrix.platform }}" \
            -skipMacroValidation \
            | xcbeautify --renderer github-actions
