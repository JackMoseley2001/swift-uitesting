name: Demo UI Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: demo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-test:
    name: Demo UI tests (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # One version of iOS from each major version that a runner image has simulators
        # for, with an Xcode and an iPhone that the same image has for it. No image has
        # an iOS 16 or iOS 17 simulator. macOS is the Mac that the job runs on.
        include:
          - platform: iOS 18.5
            xcode: "16.4"
            runner: macos-15
            destination: platform=iOS Simulator,name=iPhone 16,OS=18.5
          - platform: iOS 26.5
            xcode: "26.6"
            runner: macos-26
            destination: platform=iOS Simulator,name=iPhone 17,OS=26.5
          - platform: iOS 27
            xcode: "27.1"
            runner: xcode-27
            destination: platform=iOS Simulator,name=iPhone 17
          - platform: macOS
            xcode: "27.1"
            runner: xcode-27
            destination: platform=macOS
    env:
      DESTINATION: ${{ matrix.destination }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Select Xcode
        run: xcodes select "${{ matrix.xcode }}"

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Examples/Demo/Demo.xcodeproj \
            -scheme Demo \
            -destination "$DESTINATION" \
            -skipMacroValidation \
            | xcbeautify --renderer github-actions

      - name: Run UI tests
        run: |
          set -o pipefail
          # A simulator on a freshly started runner is sometimes not ready when the tests
          # begin. Try again in that case only; a failing test is never retried.
          for attempt in 1 2 3; do
            if xcodebuild test-without-building \
              -project Examples/Demo/Demo.xcodeproj \
              -scheme Demo \
              -destination "$DESTINATION" \
              -skipMacroValidation \
              2>&1 | tee xcodebuild.log | xcbeautify --renderer github-actions; then
              exit 0
            fi
            if ! grep -qE "simulator runtime is not available|Failed to establish communication with the test runner" xcodebuild.log; then
              exit 1
            fi
            echo "::warning::The simulator was not ready on attempt $attempt."
            sleep 45
          done
          exit 1

      - name: Show failure details
        if: failure()
        run: |
          # The formatted log shows only the first line of each failure message, so print
          # everything xcodebuild logged for each test that failed.
          awk '/^Test Case .* started\.$/ { lines = "" } { lines = lines $0 "\n" } /^Test Case .* failed \(/ { printf "%s\n", lines }' xcodebuild.log | head -n 400 || true
          xcrun simctl runtime list || true
          xcrun simctl list devices available || true
          ls -lt ~/Library/Logs/DiagnosticReports 2>/dev/null | head -n 10 || true
