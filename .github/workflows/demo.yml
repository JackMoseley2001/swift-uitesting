name: Demo UI Tests

on:
  # A pull request or a push runs the tests only when it changes something that they
  # build: the libraries, the demo, the manifests or this workflow. Documentation and
  # the package's unit tests are none of those.
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - Sources/**
      - Examples/**
      - Package.swift
      - Package@swift-*.swift
      - .github/workflows/demo.yml
      - "!**/*.md"
  push:
    branches: [main]
    paths:
      - Sources/**
      - Examples/**
      - Package.swift
      - Package@swift-*.swift
      - .github/workflows/demo.yml
      - "!**/*.md"
  # By hand, from the Actions tab or with `gh workflow run`, on any branch. This is the
  # only way to run the tests on the older versions.
  workflow_dispatch:
    inputs:
      versions:
        description: Which versions of each platform to run the tests on
        type: choice
        options:
          - all
          - latest
        default: all

concurrency:
  group: demo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Choose the versions
    runs-on: ubuntu-latest
    outputs:
      rows: ${{ steps.rows.outputs.rows }}
    steps:
      - name: Choose the versions
        id: rows
        env:
          # A pull request and a push run the latest version of each platform. A run by
          # hand runs every version, unless it asks for the latest only.
          VERSIONS: ${{ inputs.versions || 'latest' }}
        # One version of iOS from each major version that a runner image has simulators
        # for, with an Xcode and an iPhone that the same image has for it. No image has
        # an iOS 16 or iOS 17 simulator. macOS is the Mac that the job runs on. watchOS,
        # visionOS and tvOS have a row for each major version in the same way. The row
        # with the newest version of a platform has `latest`.
        run: |
          rows=$(jq -c --arg versions "$VERSIONS" \
            'map(select($versions == "all" or .latest)) | map(del(.latest))' <<'JSON'
          [
            {"platform": "iOS 18.5", "xcode": "16.4", "runner": "macos-15", "destination": "platform=iOS Simulator,name=iPhone 16,OS=18.5"},
            {"platform": "iOS 26.5", "xcode": "26.6", "runner": "macos-26", "destination": "platform=iOS Simulator,name=iPhone 17,OS=26.5"},
            {"platform": "iOS 27", "xcode": "27.1", "runner": "xcode-27", "destination": "platform=iOS Simulator,name=iPhone 17", "latest": true},
            {"platform": "macOS", "xcode": "27.1", "runner": "xcode-27", "destination": "platform=macOS", "latest": true},
            {"platform": "watchOS 11.5", "xcode": "16.4", "runner": "macos-15", "destination": "platform=watchOS Simulator,name=Apple Watch Series 10 (46mm),OS=11.5"},
            {"platform": "watchOS 26.5", "xcode": "26.6", "runner": "macos-26", "destination": "platform=watchOS Simulator,name=Apple Watch Series 11 (46mm),OS=26.5"},
            {"platform": "watchOS 27.2", "xcode": "27.2", "runner": "xcode-27", "destination": "platform=watchOS Simulator,name=Apple Watch Series 12 (46mm),OS=27.2", "latest": true},
            {"platform": "visionOS 2.5", "xcode": "16.4", "runner": "macos-15", "destination": "platform=visionOS Simulator,name=Apple Vision Pro,OS=2.5"},
            {"platform": "visionOS 26.5", "xcode": "26.6", "runner": "macos-26", "destination": "platform=visionOS Simulator,name=Apple Vision Pro,OS=26.5"},
            {"platform": "visionOS 27.2", "xcode": "27.2", "runner": "xcode-27", "destination": "platform=visionOS Simulator,name=Apple Vision Pro,OS=27.2", "latest": true},
            {"platform": "tvOS 18.5", "xcode": "16.4", "runner": "macos-15", "destination": "platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=18.5"},
            {"platform": "tvOS 26.5", "xcode": "26.6", "runner": "macos-26", "destination": "platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=26.5"},
            {"platform": "tvOS 27.2", "xcode": "27.2", "runner": "xcode-27", "destination": "platform=tvOS Simulator,name=Apple TV 4K (4th generation),OS=27.2", "latest": true}
          ]
          JSON
          )
          echo "rows=$rows" >> "$GITHUB_OUTPUT"
          echo "$rows" | jq -r '.[].platform'

  ui-test:
    name: Demo UI tests (${{ matrix.platform }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    # The suite takes longest on a watch, where scrolling is slow, and on visionOS,
    # and a slow runner takes several times as long as a fast one. The limit is above
    # that of the steps that start the simulator and run the tests together, so that a
    # run that is stopped there still uploads its results.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.rows) }}
    env:
      DESTINATION: ${{ matrix.destination }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Select Xcode
        run: xcodes select "${{ matrix.xcode }}"

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          # A freshly started runner sometimes does not list its simulators yet, and
          # the build then finds no device for the destination. Try again in that
          # case only.
          for attempt in 1 2 3 4; do
            if xcodebuild build-for-testing \
              -project Examples/Demo/Demo.xcodeproj \
              -scheme Demo \
              -destination "$DESTINATION" \
              -skipMacroValidation \
              2>&1 | tee build.log | xcbeautify --renderer github-actions; then
              exit 0
            fi
            if ! grep -q "Unable to find a device matching the provided destination specifier" build.log; then
              exit 1
            fi
            echo "::warning::The simulators were not listed on attempt $attempt."
            xcrun simctl list devices available || true
            sleep 45
          done
          exit 1

      # The first launch of the app on a simulator that is still starting takes minutes
      # on a runner, and the first test then fails on a launch that timed out. xcodebuild
      # does not run that test again, because the test runner restarts after it. So the
      # simulator is started here, and the tests begin once it has finished.
      - name: Start the simulator
        if: matrix.platform != 'macOS'
        # The tests still run if the simulator could not be found or was not ready in
        # time: they start it themselves, as they did before.
        continue-on-error: true
        timeout-minutes: 10
        run: |
          name=$(sed -n 's/.*name=\([^,]*\).*/\1/p' <<< "$DESTINATION")
          version=$(sed -n 's/.*OS=\([^,]*\).*/\1/p' <<< "$DESTINATION")
          # The simulator with the name in the destination, on the runtime of its
          # version, or on the newest runtime when the destination names no version.
          device=$(xcrun simctl list devices available --json | jq -r \
            --arg name "$name" --arg version "$version" '
              .devices | to_entries
              | map({
                  version: [.key | scan("-([0-9]+)") | .[0] | tonumber],
                  devices: .value
                })
              | map(select($version == "" or (.version | map(tostring) | join(".")) == $version))
              | sort_by(.version) | reverse
              | map(.devices[] | select(.name == $name) | .udid)
              | first // empty')
          if [ -z "$device" ]; then
            echo "::warning::No simulator was found for $DESTINATION."
            exit 1
          fi
          # Starts the simulator if it is not running, and waits until it has finished.
          xcrun simctl bootstatus "$device" -b
          # A simulator that has just started goes on working for some minutes: it
          # indexes, fetches assets and draws its wallpaper, and with the build just
          # over that takes every core of the runner. The tests wait, for five minutes
          # at most, until a third of the processor is idle.
          for check in $(seq 1 30); do
            idle=$(top -l 2 -n 0 -s 10 | awk '/^CPU usage/ { idle = $7 } END { print int(idle) }')
            echo "Idle: $idle%"
            if [ "$idle" -ge 33 ]; then
              break
            fi
          done

      - name: Show the runner's load before the tests
        # How many cores and how much memory the runner has, how busy it is, and what
        # is using it. A runner is several times slower than a Mac on a desk, and this
        # is here to show why.
        continue-on-error: true
        timeout-minutes: 2
        run: |
          echo "Cores: $(sysctl -n hw.ncpu), memory: $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
          uptime
          memory_pressure | tail -n 1
          top -l 2 -n 12 -o cpu -stats pid,command,cpu,mem | tail -n 24

      - name: Run UI tests
        timeout-minutes: 55
        env:
          # xcodebuild keeps what it prints until the end when its output is a pipe,
          # so the log of this step would say nothing while the tests run. With this
          # it prints each line as it happens.
          NSUnbufferedIO: "YES"
        run: |
          set -o pipefail
          # A test that hangs is stopped after five minutes and fails, so that the log
          # names it; without that, the whole job runs out of time and says nothing.
          # A test that fails is run once more, because a runner is several times
          # slower than a Mac on a desk and now and then loses a tap or is late with a
          # screen. A test that is broken fails both times.
          # A simulator on a freshly started runner is sometimes not ready when the tests
          # begin. The whole run is tried again in that case only.
          for attempt in 1 2 3; do
            rm -rf Demo.xcresult
            if xcodebuild test-without-building \
              -project Examples/Demo/Demo.xcodeproj \
              -scheme Demo \
              -destination "$DESTINATION" \
              -skipMacroValidation \
              -resultBundlePath Demo.xcresult \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 300 \
              -maximum-test-execution-time-allowance 300 \
              -retry-tests-on-failure \
              -test-iterations 2 \
              2>&1 | tee xcodebuild.log | xcbeautify --renderer github-actions; then
              exit 0
            fi
            if ! grep -qE "simulator runtime is not available|Failed to establish communication with the test runner|Failed to install or launch the test runner" xcodebuild.log; then
              exit 1
            fi
            echo "::warning::The simulator was not ready on attempt $attempt."
            sleep 45
          done
          exit 1

      - name: Show the runner's load after the tests
        if: always()
        # How many cores and how much memory the runner has, how busy it is, and what
        # is using it. A runner is several times slower than a Mac on a desk, and this
        # is here to show why.
        continue-on-error: true
        timeout-minutes: 2
        run: |
          echo "Cores: $(sysctl -n hw.ncpu), memory: $(( $(sysctl -n hw.memsize) / 1073741824 )) GB"
          uptime
          memory_pressure | tail -n 1
          top -l 2 -n 12 -o cpu -stats pid,command,cpu,mem | tail -n 24

      - name: Show failure details
        if: failure()
        # A simulator that has stopped answering makes simctl wait for it without end,
        # and the steps after this one upload the results.
        timeout-minutes: 5
        run: |
          # The formatted log shows only the first line of each failure message, so print
          # everything xcodebuild logged for each test that failed.
          awk '/^Test Case .* started\.$/ { lines = "" } { lines = lines $0 "\n" } /^Test Case .* failed \(/ { printf "%s\n", lines }' xcodebuild.log | head -n 400 || true
          # Where the run stopped, for one that ran out of time.
          tail -n 60 xcodebuild.log || true
          xcrun simctl runtime list || true
          xcrun simctl list devices available || true
          ls -lt ~/Library/Logs/DiagnosticReports 2>/dev/null | head -n 10 || true

      # The result bundle has the screen and the element hierarchy at each failure.
      # It is uploaded as one archive, because its files have names that an artifact
      # cannot, beside the log of xcodebuild.
      - name: Archive the results
        if: failure()
        run: |
          if [ -d Demo.xcresult ]; then
            COPYFILE_DISABLE=1 tar -czf Demo.xcresult.tar.gz Demo.xcresult
          fi

      - name: Upload the results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Results (${{ matrix.platform }})
          path: |
            Demo.xcresult.tar.gz
            xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
